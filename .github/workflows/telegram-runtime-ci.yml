name: Telegram Runtime CI

on:
  push:
    branches: [main]
    paths:
      - telegram-bot.local/**
      - src/model/**
      - .github/workflows/telegram-runtime-ci.yml
  pull_request:
    paths:
      - telegram-bot.local/**
      - src/model/**
      - .github/workflows/telegram-runtime-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            telegram-bot.local/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install runtime dependencies
        run: npm ci
        working-directory: telegram-bot.local
      - name: Typecheck runtime
        run: npm run typecheck
        working-directory: telegram-bot.local
      - name: Test runtime
        run: npm test
        working-directory: telegram-bot.local
      - name: Build runtime
        run: npm run build
        working-directory: telegram-bot.local
