name: Telegram Runtime CI

on:
  push:
    branches: [main]
    paths:
      - telegram-bot.local/**
      - src/model/**
      - .github/workflows/telegram-runtime-ci.yml
  pull_request:
    paths:
      - telegram-bot.local/**
      - src/model/**
      - .github/workflows/telegram-runtime-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-bot.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: telegram-bot.local/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
